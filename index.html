<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página responsiva</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#eef2f5;">

  <header style="background-color:#2e6da4; padding:35px 20px; width:100%; box-sizing:border-box;">
    <h1 style="color:white; text-align:center; font-size:28px; font-weight:normal; margin:0;">Mi página web</h1>
  </header>
  
  <main style="background-color:white; max-width:600px; margin:0 auto; padding:30px 20px; text-align:center; box-sizing:border-box;">
    
    <h2 style="margin-bottom:15px; font-size:22px;">Bienvenidos</h2>
    
    <p style="margin-bottom:20px; line-height:1.5;">Esta página se adapta al tamaño de la pantalla del dispositivo.</p>
    
    <img src="sherl.png" alt="Imagen de ejemplo" style="width:100%; max-width:450px; height:auto; display:block; margin:0 auto 20px auto; border-radius:5px;">
    
    <p style="margin-bottom:20px; line-height:1.5;">Puedes verla en una computadora o en un teléfono celular.</p>

  </main>

</body>
</html>
